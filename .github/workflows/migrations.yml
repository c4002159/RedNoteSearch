name: Migrations

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: changethis
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest-known"
      - name: Create local .env from the example
        run: cp .env.example .env
      - name: Alembic has exactly one head
        working-directory: backend
        run: |
          uv run alembic heads
          test "$(uv run alembic heads | grep -c '(head)')" = "1"
      - name: Upgrade an empty database to head
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Models match the migrations (every model is imported by app.models)
        working-directory: backend
        run: uv run alembic check
      - name: vector extension exists
        env:
          PGPASSWORD: changethis
        run: psql -h localhost -U postgres -d app -tAc "SELECT 1 FROM pg_extension WHERE extname = 'vector'" | grep -q 1
      - name: Downgrade one step and upgrade again
        working-directory: backend
        run: |
          uv run alembic downgrade -1
          uv run alembic upgrade head
