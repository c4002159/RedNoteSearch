# One-machine deployment: a database and one application container (it serves the web pages too).
# Start it with deploy/start.ps1 (Windows) or deploy/start.sh (macOS/Linux); see docs/DEPLOY_QUICKSTART.md.
name: rednote

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - rednote-db-data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run the start script first}
      POSTGRES_DB: app

  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      PROJECT_NAME: RedNoteSearch
      SECRET_KEY: ${SECRET_KEY:?run the start script first}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:?run the start script first}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?run the start script first}
      FRONTEND_HOST: ${PUBLIC_URL:-http://localhost:8000}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/app
      # Model keys are normally entered by the platform admin in the web page (ADR-013); these are optional.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    # Migrations and the first admin account run on every start; both are safe to repeat.
    command: ["bash", "-c", "bash scripts/prestart.sh && exec fastapi run --workers 2"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  rednote-db-data:
