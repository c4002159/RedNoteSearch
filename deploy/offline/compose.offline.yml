# Offline deployment: application and database images come from the package tar files; no build.
# Start with 启动.bat (Windows) or 启动.sh (macOS/Linux).
name: rednote

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - rednote-db-data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先运行 启动.bat 或 启动.sh}
      POSTGRES_DB: app

  app:
    image: rednote-app:${APP_TAG}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      PROJECT_NAME: RedNoteSearch
      SECRET_KEY: ${SECRET_KEY:?请先运行 启动.bat 或 启动.sh}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:?请先运行 启动.bat 或 启动.sh}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?请先运行 启动.bat 或 启动.sh}
      FRONTEND_HOST: ${PUBLIC_URL:-http://localhost:8000}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/app
      # Model keys are normally entered by the platform admin in the web page (ADR-013); these are optional.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    # Migrations and the first admin account run on every start; both are safe to repeat.
    command: ["bash", "-c", "bash scripts/prestart.sh && exec fastapi run --workers 2"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  rednote-db-data:
